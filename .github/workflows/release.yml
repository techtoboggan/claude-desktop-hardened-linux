name: Release

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE_VERSION'
  workflow_run:
    workflows: ["Check Upstream Version"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize release runs so two dispatches don't race to publish to the
# same tag. `cancel-in-progress: false` (NOT true) because the workflow's
# own `check-version` step decides whether a new run is a real build or a
# skip-only no-op — we let the in-flight build finish and queue the new
# run, which will then make its own should_release decision. Previously
# `cancel-in-progress: true` aborted a real build mid-flight when a
# triggered-by-failure workflow_run came in and skipped itself, leaving
# nothing built.
#
# Tag-collision protection is now handled by the tag-already-exists check
# in check-version (workflow_run path) + softprops's overwrite_files
# default (workflow_dispatch path).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Read CLAUDE_VERSION
        id: version
        run: |
          VERSION=$(head -1 CLAUDE_VERSION | tr -d '[:space:]')
          LAST_TAG=$(git tag -l "v${VERSION}-*" --sort=-v:refname | head -1)
          if [ -n "$LAST_TAG" ]; then
            BUILD=$(( $(echo "$LAST_TAG" | grep -oP '\d+$') + 1 ))
          else
            BUILD=1
          fi
          TAG="v${VERSION}-${BUILD}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}, tag: ${TAG}"

      - name: Check if release needed
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "workflow_run" ]; then
            # Triggered by check-upstream: only release if this version has
            # never been released before. The build-increment logic would
            # otherwise produce a new tag every hourly run even with no
            # upstream version change.
            if git tag -l "v${VERSION}-*" | grep -q .; then
              echo "Version ${VERSION} already has a release tag — skipping (workflow_run)"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "New upstream version ${VERSION} detected — will release"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # push to CLAUDE_VERSION or workflow_dispatch: use build-increment
            # so deliberate packaging-fix releases (same version, new build) work.
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists, skipping"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-rpm:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: fedora@sha256:781b7642e8bf256e9cf75d2aa58d86f5cc695fd2df113517614e181a5eee9138
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build RPM
        shell: bash
        run: FORMAT=rpm ./build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-package
          path: build/electron-app/**/*.rpm

  build-deb:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:186072bba1b2f436cbb91ef2567abca677337cfc786c86e107d25b7072feef0c
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git sudo

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build DEB
        shell: bash
        run: FORMAT=deb ./build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-package
          path: build/electron-app/**/*.deb

  build-arch:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: archlinux@sha256:8435d30c1462f94345c3894ebbeaeecd658fcb284aa41b0bcc5f88728933447f
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Arch package
        shell: bash
        run: FORMAT=arch ./build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-package
          path: |
            build/electron-app/**/*.pkg.tar.*
            build/electron-app/**/PKGBUILD

  sbom:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate CycloneDX SBOM
        run: |
          npm install -g @cyclonedx/cdxgen@11.11.0
          cdxgen -o sbom.json --spec-version 1.5 .
          echo "SBOM: $(jq '.components | length' sbom.json) components"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

  release:
    needs: [check-version, build-rpm, build-deb, build-arch, sbom]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the API to create tags — avoids workflow permission issues
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/${{ needs.check-version.outputs.tag }}" \
            -f sha="${{ github.sha }}" || echo "Tag may already exist"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.rpm" -o -name "*.deb" -o -name "*.pkg.tar.*" -o -name "sbom.json" \) \
            -exec sha256sum {} \; | sort > ../SHA256SUMS
          cd ..
          echo "Generated checksums for $(wc -l < SHA256SUMS) files"
          cat SHA256SUMS

      - name: GPG sign checksums
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign SHA256SUMS
          echo "Checksums signed with GPG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Claude Desktop ${{ needs.check-version.outputs.version }} (build ${{ needs.check-version.outputs.tag }})
          body: |
            ## Claude Desktop v${{ needs.check-version.outputs.version }} for Linux

            ### Quick install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/techtoboggan/claude-desktop-hardened-linux/main/install.sh | bash
            ```

            **Fedora (COPR):**
            ```bash
            sudo dnf copr enable techtoboggan/claude-desktop-hardened
            sudo dnf install claude-desktop-hardened
            ```

            ### Manual install
            Download packages from this release:
            ```bash
            sudo dnf install claude-desktop-hardened-*.rpm        # Fedora/RHEL
            sudo dpkg -i claude-desktop-hardened_*.deb            # Debian/Ubuntu
            sudo pacman -U claude-desktop-hardened-*.pkg.tar.zst  # Arch
            ```

            ### What's included
            - Claude Desktop with Cowork (Local Agent Mode) support + bubblewrap sandboxing
            - Bundled Claude Code CLI
            - MCP support
            - System tray integration
            - Native Wayland support

            ### Supply chain security
            - SBOM (CycloneDX) attached as `sbom.json`
            - `SHA256SUMS` with GPG signature for integrity verification
            - All CI actions pinned to commit SHAs
            - Source scanned for trojan source attacks and malware
            - nupkg SHA256 verified against pin in `CLAUDE_VERSION`
          files: |
            artifacts/**/*.rpm
            artifacts/**/*.deb
            artifacts/**/*.pkg.tar.*
            artifacts/**/PKGBUILD
            artifacts/sbom/sbom.json
            SHA256SUMS
            SHA256SUMS.asc
          draft: false
          prerelease: false
          # Belt-and-suspenders for the concurrency group above: if a tag
          # already has files (e.g. from a previous failed dispatch), we
          # want to REPLACE them, not silently keep the old artifacts.
          make_latest: "true"

  # ---------------------------------------------------------------------------
  # Publish to Fedora COPR
  # ---------------------------------------------------------------------------
  publish-copr:
    needs: [check-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: fedora@sha256:781b7642e8bf256e9cf75d2aa58d86f5cc695fd2df113517614e181a5eee9138
    steps:
      - name: Install tools
        run: dnf install -y copr-cli rpm-build rpmdevtools cpio gettext

      - name: Configure COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          mkdir -p ~/.config
          printf '[copr-cli]\nlogin = %s\nusername = %s\ntoken = %s\ncopr_url = https://copr.fedoraproject.org\n' \
            "$COPR_LOGIN" "$COPR_USERNAME" "$COPR_TOKEN" > ~/.config/copr

      - name: Download RPM from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dnf install -y gh
          gh release download "${{ needs.check-version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.rpm" \
            --dir ./rpms

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source

      - name: Build SRPM from binary RPM
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          RPM_FILE=$(ls ./rpms/*.rpm | head -1)

          # Extract the binary RPM contents into a tarball
          mkdir -p extract
          cd extract && rpm2cpio "../$RPM_FILE" | cpio -idmv 2>/dev/null && cd ..
          tar czf claude-desktop-hardened-${VERSION}.tar.gz -C extract .

          # Use the generated COPR spec from the repo (single source of truth)
          # Extract build number from tag (v1.1.9310-9 → 9) for RPM release field
          export VERSION
          export RELEASE_NUM=$(echo "$TAG" | grep -oP '\d+$')
          echo "COPR spec: version=${VERSION} release=${RELEASE_NUM}"
          envsubst '$VERSION $RELEASE_NUM' < source/packaging/rpm/claude-desktop-hardened.copr.spec.in > claude-desktop-hardened.spec

          # Build SRPM
          rpmdev-setuptree
          cp claude-desktop-hardened-${VERSION}.tar.gz ~/rpmbuild/SOURCES/
          cp claude-desktop-hardened.spec ~/rpmbuild/SPECS/
          rpmbuild -bs ~/rpmbuild/SPECS/claude-desktop-hardened.spec

      - name: Regenerate COPR repos before build
        run: |
          # Regenerate repo metadata to recover from any previously failed builds
          # that left the repo in a broken state (COPR waits for base repo before
          # starting new builds, so stale metadata causes the next build to time out).
          copr-cli regenerate-repos claude-desktop-hardened || true

      - name: Upload SRPM to COPR
        run: |
          SRPM=$(find ~/rpmbuild/SRPMS/ -name '*.src.rpm' | head -1)
          echo "Uploading $SRPM"
          copr-cli build claude-desktop-hardened "$SRPM" \
            --chroot fedora-43-x86_64 \
            --chroot fedora-44-x86_64 \
            --nowait

  # ---------------------------------------------------------------------------
  # Publish APT repository to GitHub Pages
  # ---------------------------------------------------------------------------
  # RETIRED (2026-07 rebase): the official Linux .deb bundles Electron, so our
  # repackaged .deb is ~187MB — over GitHub's 100MB git file limit, which the
  # gh-pages-hosted apt pool cannot store. Debian/Ubuntu users should install
  # the hardened .deb directly from the GitHub Release (dpkg -i), or use
  # Anthropic's official apt repo for the plain (unhardened) app.
  publish-apt:
    needs: [check-version, release]
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Install APT repo tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils

      - name: Download DEB from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf ./incoming
          gh release download "${{ needs.check-version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir ./incoming \
            --clobber

      - name: Update APT repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # Move .deb into pool
          mkdir -p pool/main
          cp incoming/*.deb pool/main/

          # Generate Packages index
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive packages pool/main > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # Generate Release file
          cat > dists/stable/Release <<RELEOF
          Origin: claude-desktop-hardened
          Label: Claude Desktop Hardened Linux
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Date: $(date -Ru)
          Description: Security-focused Claude Desktop for Linux
          RELEOF
          sed -i 's/^          //' dists/stable/Release

          # Add hashes to Release
          apt-ftparchive release dists/stable >> dists/stable/Release

          # GPG sign if key is available
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
            gpg --batch --yes --armor --clearsign -o dists/stable/InRelease dists/stable/Release
            # Export public key for users
            gpg --batch --yes --armor --export > pubkey.asc
            echo "APT repo signed with GPG"
          else
            echo "WARNING: No GPG key — APT repo is unsigned"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: update to ${{ needs.check-version.outputs.version }}" || echo "No changes"
          git pull --rebase origin gh-pages || true
          git push origin gh-pages

  # ---------------------------------------------------------------------------
  # Publish to AUR
  # ---------------------------------------------------------------------------
  # PAUSED (2026-07): the AUR package was deleted upstream and our CI
  # re-created it on push. Auto-publishing is disabled until we resolve the
  # deletion with the AUR maintainers and re-submit deliberately (change
  # `if: false` back to the should_release condition to re-enable).
  publish-aur:
    needs: [check-version, release]
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update AUR package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
        if: env.AUR_SSH_KEY != ''
        run: |
          # Set up SSH for AUR
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=no"

          # Clone AUR repo
          git clone ssh://aur@aur.archlinux.org/claude-desktop-hardened-bin.git /tmp/aur
          cd /tmp/aur

          BUILDNUM=$(echo "$TAG" | grep -oP '\d+$')

          # DISCOVER the actual arch asset filename from the release rather
          # than constructing it. The artifact's internal pkgrel (always 1,
          # from CI's PKGBUILD.in) differs from the release tag's build
          # number, so a constructed name would mismatch (see issue #5
          # follow-up). Match the bin .pkg.tar.zst asset by glob.
          PKGFILE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name | select(test("^claude-desktop-hardened-bin-.*-x86_64\\.pkg\\.tar\\.zst$"))' | head -1)
          if [ -z "$PKGFILE" ]; then
            echo "::error::No arch bin artifact found on release $TAG"; exit 1
          fi

          # Pull that artifact's sha256 from the release's SHA256SUMS.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D /tmp/sums --clobber
          SHA256=$(grep -F "$PKGFILE" /tmp/sums/SHA256SUMS | awk '{print $1}' | head -1)
          if [ -z "$SHA256" ]; then
            echo "::error::Could not find sha256 for $PKGFILE in SHA256SUMS"; cat /tmp/sums/SHA256SUMS; exit 1
          fi
          echo "Artifact $PKGFILE  tag=$TAG  sha256=$SHA256"

          # Build the AUR PKGBUILD from the self-contained template (the
          # CI-build template PKGBUILD.in needs a local staging dir and
          # would fail for standalone makepkg — see issue #5). Substitute
          # discovered filename + tag so the download URL is exact.
          sed -e "s/@@VERSION@@/${VERSION}/g" \
              -e "s/^pkgrel=.*/pkgrel=${BUILDNUM}/" \
              -e "s/@@SHA256@@/${SHA256}/g" \
              -e "s/@@PKGFILE@@/${PKGFILE}/g" \
              -e "s/@@TAG@@/${TAG}/g" \
            "$GITHUB_WORKSPACE/packaging/arch/PKGBUILD.aur.in" > PKGBUILD

          # Regenerate .SRCINFO (copy PKGBUILD to temp dir to avoid .git permission issues)
          docker run --rm -v "$(pwd)/PKGBUILD:/tmp/PKGBUILD:ro" archlinux@sha256:8435d30c1462f94345c3894ebbeaeecd658fcb284aa41b0bcc5f88728933447f bash -c \
            'pacman -Sy --noconfirm base-devel sudo >/dev/null 2>&1 && useradd -m builduser && cp /tmp/PKGBUILD /home/builduser/ && chown builduser: /home/builduser/PKGBUILD && cd /home/builduser && sudo -u builduser makepkg --printsrcinfo' > .SRCINFO

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}-${BUILDNUM}" || echo "No changes"
          git pull --rebase || true
          git push
