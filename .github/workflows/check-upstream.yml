name: Check Upstream Version

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

# Least privilege by default: read-only workflow token. Only push-update
# (commits the version bump) and open-issue (files a build-failure issue) get
# write, scoped per-job below. The `check` and `test-build` jobs — which run
# curl + the build toolchain — stay read-only, so a compromised dependency
# there can't write to the repo.
permissions:
  contents: read

# Two scheduled runs near a version bump would each try to push the same
# CLAUDE_VERSION update, and the slower one's `git push` got rejected by
# "remote contains work that you do not have locally". Serialize them.
# `cancel-in-progress: false` because we want the EARLIER run to finish
# its (already-running) build before the next 10-min tick claims the slot.
concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      latest: ${{ steps.check.outputs.latest }}
      current: ${{ steps.check.outputs.current }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check for new upstream version
        id: check
        run: |
          CURRENT=$(head -1 CLAUDE_VERSION | tr -d '[:space:]')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # Poll Anthropic's OFFICIAL Linux apt repo (amd64) — the base we build
          # from since the 2026-07 pivot (no more win32 nupkg). The signed
          # Packages index carries both the version and the .deb's SHA256, so we
          # read the pin straight from it (no need to download the 159MB .deb).
          PKGS=$(curl -sL "https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages")
          LATEST=$(printf '%s\n' "$PKGS" | awk '/^Version:/{print $2}' | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            echo "Could not determine latest official version"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already up to date: $CURRENT"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "New official Linux build available: $LATEST (current: $CURRENT)"
            # SHA256 for that version's .deb, straight from the signed index.
            SHA=$(printf '%s\n' "$PKGS" | awk -v v="$LATEST" '
              /^Version:/{ver=$2} /^SHA256:/{if(ver==v){print $2; exit}}')
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
            echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------------------
  # Test the new version builds cleanly before pushing
  # -------------------------------------------------------------------------
  test-build:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    container: fedora@sha256:781b7642e8bf256e9cf75d2aa58d86f5cc695fd2df113517614e181a5eee9138
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pin new version
        run: |
          printf '%s\n%s\n' "${{ needs.check.outputs.latest }}" "${{ needs.check.outputs.sha256 }}" > CLAUDE_VERSION
          cat CLAUDE_VERSION

      - name: Build (Fedora RPM)
        id: build
        run: |
          FORMAT=rpm ./build.sh 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Verify build produced a valid package
        id: verify
        if: steps.build.outcome == 'success'
        run: |
          # We no longer patch app.asar (we repackage the official Linux build),
          # so "success" just means: an RPM was produced AND the official app
          # payload is inside it.
          dnf install -y cpio >/dev/null 2>&1 || true
          RPM=$(find build/electron-app -name 'claude-desktop-hardened-*.rpm' ! -name '*computeruse*' 2>/dev/null | head -1)
          if [ -z "$RPM" ]; then
            echo "No RPM produced"; echo "status=failed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Built: $RPM"
          if rpm2cpio "$RPM" | cpio -t 2>/dev/null | grep -q 'claude-desktop-hardened/resources/app.asar'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "official app payload (app.asar) missing from package"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: /tmp/build.log

      - name: Set overall status
        id: overall
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ] && \
             [ "${{ steps.verify.outputs.status }}" = "passed" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            # Fail the job so a broken build shows RED in the Actions tab
            # (the build step is continue-on-error). open-issue is guarded with
            # always() so it still fires; the status output is written first.
            exit 1
          fi

    outputs:
      status: ${{ steps.overall.outputs.status }}
      build_outcome: ${{ steps.build.outcome }}
      verify_status: ${{ steps.verify.outputs.status }}

  # -------------------------------------------------------------------------
  # On success: push CLAUDE_VERSION update to main (triggers release)
  # -------------------------------------------------------------------------
  push-update:
    needs: [check, test-build]
    if: needs.test-build.outputs.status == 'passed'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit + push the CLAUDE_VERSION bump
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update CLAUDE_VERSION and push
        run: |
          VERSION="${{ needs.check.outputs.latest }}"
          SHA="${{ needs.check.outputs.sha256 }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Belt-and-suspenders for the concurrency group above. If another
          # run beat us to pushing the same bump, our local main is stale
          # by the time we get here. Pull-rebase first, then check if the
          # version is already at the target before doing redundant work.
          git pull --rebase origin main
          CURRENT_FILE_VERSION=$(head -1 CLAUDE_VERSION | tr -d '[:space:]')
          if [ "$CURRENT_FILE_VERSION" = "$VERSION" ]; then
            echo "CLAUDE_VERSION is already at $VERSION — another run got there first. No-op."
            exit 0
          fi

          printf '%s\n%s\n' "$VERSION" "$SHA" > CLAUDE_VERSION
          git add CLAUDE_VERSION
          git commit -m "bump: upstream Claude Desktop ${VERSION}

          Automated version bump from ${{ needs.check.outputs.current }} to ${VERSION}.
          Build tested successfully before merge.
          SHA256: ${SHA}"

          # If push still races (someone else pushed between our pull and
          # push — extremely narrow window with the concurrency group),
          # rebase and retry once before giving up.
          if ! git push origin main; then
            echo "Push rejected — rebasing and retrying once"
            git pull --rebase origin main
            # Re-check after rebase: if someone else landed the same bump,
            # our commit is now redundant and rebase would have dropped it
            # already (same tree). Exit clean.
            if ! git log -1 --format=%H origin/main..HEAD >/dev/null 2>&1 || \
               [ -z "$(git log origin/main..HEAD --oneline)" ]; then
              echo "Nothing left to push after rebase — another run beat us. No-op."
              exit 0
            fi
            git push origin main
          fi

  # -------------------------------------------------------------------------
  # On failure: open a GitHub issue with diagnostics
  # -------------------------------------------------------------------------
  open-issue:
    needs: [check, test-build]
    # always() so this still runs now that a failed test-build fails the job
    # (a needed-job failure would otherwise skip this despite the condition).
    if: always() && needs.test-build.outputs.status == 'failed'
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout only
      issues: write     # file/update the build-failure issue
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download build log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-log
          path: ./logs

      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.latest }}"
          BUILD="${{ needs.test-build.outputs.build_outcome }}"
          PATCHES="${{ needs.test-build.outputs.patch_status }}"
          ELECTRON="${{ needs.test-build.outputs.electron_status }}"

          # Extract relevant failures from build log
          FAILURES=""
          if [ -f logs/build.log ]; then
            FAILURES=$(grep -E '\[FAIL\]|\[ERROR\]|Error:|error:' logs/build.log | head -30)
          fi

          # Check if an issue already exists for this version
          EXISTING=$(gh issue list --search "Build failure: Claude Desktop ${VERSION}" --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            # Count existing comments to implement backoff — stop commenting after 6 retries
            COMMENT_COUNT=$(gh issue view "$EXISTING" --json comments --jq '.comments | length' 2>/dev/null || echo 0)
            if [ "$COMMENT_COUNT" -ge 6 ]; then
              echo "Issue #${EXISTING} already has ${COMMENT_COUNT} retry comments — suppressing further updates to avoid spam"
              exit 0
            fi
            echo "Issue #${EXISTING} already exists for ${VERSION}, adding comment (${COMMENT_COUNT}/6)"
            gh issue comment "$EXISTING" --body "Retry failed at $(date -u +%Y-%m-%dT%H:%M:%SZ).

          **Build:** ${BUILD} | **Patches:** ${PATCHES} | **Electron:** ${ELECTRON}

          \`\`\`
          ${FAILURES}
          \`\`\`

          _Retry ${COMMENT_COUNT}/6 — updates will stop after 6 retries to avoid noise._"
            exit 0
          fi

          gh issue create \
            --title "Build failure: Claude Desktop ${VERSION}" \
            --label "bug,automated" \
            --body "$(cat <<ISSUEEOF
          The upstream version monitor detected Claude Desktop **${VERSION}** but the build failed.

          ## Status
          | Check | Result |
          |-------|--------|
          | Build | ${BUILD} |
          | Patches | ${PATCHES} |
          | Electron syntax | ${ELECTRON} |

          ## Failures
          \`\`\`
          ${FAILURES}
          \`\`\`

          ## What to do
          1. Check the [build log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details
          2. The patches in \`patches/\` likely need updating for new minified symbol names
          3. Once fixed, the next 10-minute check will auto-release

          *This issue was created automatically by the upstream version monitor.*
          ISSUEEOF
          )"
